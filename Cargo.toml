[package]
name = "gl3d-rs"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["wayland"]
wayland = ["winit/wayland"]
validation_layers = []

[dependencies]
winit = "0.30"
itertools = "0.14.0"
vk-mem = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "1.0.0"

[dependencies.ash]
version = "0.38.0+1.3.281"
